name: Preview

# Deploy de preview (Worker separado k3d-front-preview) a cada push na preview-stage.
# Não afeta produção (Worker k3d-front, deployado da stage).
on:
  push:
    branches: [ preview-stage ]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gera o bundle do Worker (.open-next/worker.js) a partir do build do Next.
      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      # Publica no Worker de preview (env "preview" do wrangler.jsonc).
      - name: Deploy preview
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
