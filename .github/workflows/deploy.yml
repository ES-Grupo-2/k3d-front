name: Deploy

# Faz deploy do frontend (OpenNext -> Cloudflare Workers) a cada push na stage.
on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gera o bundle do Worker (.open-next/worker.js) a partir do build do Next.
      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      # Publica no Worker definido em wrangler.jsonc; wrangler lê o token e a conta das env.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
